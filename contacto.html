    <main>

        <section class="formulario">

            <h2>Contáctanos</h2>

            <form id="formContacto">

                <label>
                    Nombre:
                </label>

                <input type="text"
                       id="nombreContacto">

                <label>
                    Correo:
                </label>

                <input type="email"
                       id="emailContacto">

                <label>
                    Mensaje:
                </label>

                <textarea id="mensajeContacto"></textarea>

                <button type="submit">
                    Enviar mensaje
                </button>

            </form>

            <p id="mensajeContactoResultado"></p>

        </section>

    </main>
