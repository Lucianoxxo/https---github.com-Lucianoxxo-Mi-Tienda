<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registro - Mi Tienda</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <nav class="menu">

            <div class="logo">
                <h1>Mi Tienda</h1>
            </div>

            <ul>

                <li>
                    <a href="index.html">Inicio</a>
                </li>

                <li>
                    <a href="productos.html">Productos</a>
                </li>

                <li>
                    <a href="login.html">Iniciar sesión</a>
                </li>

            </ul>

        </nav>

    </header>


    <main>

        <section class="formulario">

            <h2>Crear cuenta</h2>

            <form id="formRegistro">

                <label>
                    Nombre:
                </label>

                <input type="text"
                       id="nombreRegistro">

                <label>
                    RUT:
                </label>

                <input type="text"
                       id="rutRegistro"
                       placeholder="12345678-9">

                <label>
                    Correo:
                </label>

                <input type="email"
                       id="emailRegistro">

                <label>
                    Contraseña:
                </label>

                <input type="password"
                       id="passwordRegistro">

                <label>
                    Confirmar contraseña:
                </label>

                <input type="password"
                       id="confirmarRegistro">

                <button type="submit">
                    Registrarse
                </button>

            </form>

            <p id="mensajeRegistro"></p>

        </section>

    </main>


    <footer>

        <p>Mi Tienda © 2026</p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
