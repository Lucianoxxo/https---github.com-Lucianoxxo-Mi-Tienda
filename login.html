<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <nav class="menu">

            <div class="logo">
                <h1>Mi Tienda</h1>
            </div>

            <ul>

                <li>

                </li>

                <li>

                </li>

            </ul>

        </nav>

    <main>

        <section class="formulario">

            <h2>Iniciar sesión</h2>

            <form id="formLogin">

                <label>
                    Correo:
                </label>

                <input type="email"
                       id="emailLogin">

                <label>
                    Contraseña:
                </label>

                <input type="password"
                       id="passwordLogin">

                <button type="submit">
                    Ingresar
                </button>

            </form>

            <p id="mensajeLogin"></p>

        </section>

    </main>


    <footer>

        <p>Mi Tienda © 2026</p>

    </footer>


    <script src="script.js"></script>
